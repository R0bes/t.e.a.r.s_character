<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.E.A.R.S. – Charaktererstellung</title>
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #0f1623;
  --bg2:      #141d2e;
  --bg3:      #1a2540;
  --bg4:      #20304e;
  --border:   #263554;
  --accent:   #e94560;
  --accent2:  #4fc3f7;
  --ok:       #56c27a;
  --warn:     #ffb300;
  --err:      #ef5350;
  --text:     #dce3f0;
  --muted:    #6b7fa8;
  --sheet-bg: #ffffff;
}

body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:14px}

/* ── TOP BAR ── */
.topbar{background:#0b0f1a;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--accent);flex-shrink:0;height:42px}
.topbar-logo{font-size:15px;font-weight:900;letter-spacing:2px;color:var(--accent);white-space:nowrap}
.topbar-sep{width:1px;height:22px;background:var(--border)}
.topbar-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.topbar-actions button{padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:700;transition:opacity .15s}
.topbar-actions button:hover{opacity:.85}
.btn-save{background:var(--accent2);color:#0b0f1a}
.btn-load{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.btn-exp{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.btn-imp{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.btn-print{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.btn-reset{background:var(--err);color:#fff}
.save-indicator{font-size:11px;color:var(--muted);transition:all .3s}
.save-indicator.saved{color:var(--ok)}

/* ── STATUS BAR ── */
.statusbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:5px 12px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.status-chip{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);padding:3px 9px;border-radius:20px;font-size:11px;cursor:default;transition:border-color .2s}
.status-chip:hover{border-color:var(--accent2)}
.status-chip .s-lbl{color:var(--muted)}
.status-chip .s-val{font-weight:700;color:var(--accent2)}
.status-chip .s-prog{display:flex;align-items:center;gap:4px}
.status-chip .prog-bar{width:40px;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.status-chip .prog-fill{height:100%;border-radius:3px;background:var(--accent2);transition:width .2s}
.status-chip.over{border-color:var(--err)}
.status-chip.over .s-val{color:var(--err)}
.status-chip.over .prog-fill{background:var(--err)}
.status-chip.full{border-color:var(--ok)}
.status-chip.full .s-val{color:var(--ok)}
.status-chip.full .prog-fill{background:var(--ok)}

/* ── CHECKLIST ── */
.checklist{background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 12px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.cl-item{display:flex;align-items:center;gap:4px;font-size:11px}
.cl-dot{width:7px;height:7px;border-radius:50%;background:var(--err);flex-shrink:0;transition:background .2s}
.cl-item.done .cl-dot{background:var(--ok)}
.cl-item span{color:var(--muted);transition:color .2s}
.cl-item.done span{color:var(--ok)}

/* ── MAIN ── */
.main{display:flex;flex:1;overflow:hidden}

/* ── SHEET PANEL ── */
.sheet-panel{width:46%;overflow-y:auto;background:var(--sheet-bg);color:#111;padding:14px;border-right:2px solid var(--border);flex-shrink:0}

/* sheet styles */
.cs-h1{font-family:'Courier New',monospace;font-size:20px;font-weight:900;letter-spacing:3px;border:3px solid #111;padding:7px 12px;background:#e8e8e8;margin-bottom:10px;text-align:center}
.cs-sec{margin-bottom:12px}
.cs-sh{font-family:'Courier New',monospace;font-size:12px;font-weight:900;letter-spacing:2px;border:2px solid #111;padding:3px 8px;background:#e8e8e8;margin-bottom:5px}
.cs-tbl{border:1px solid #ccc;width:100%}
.cs-tbl .row{display:flex;border-bottom:1px solid #ccc}
.cs-tbl .row:last-child{border-bottom:none}
.cs-tbl .lbl{font-size:11px;padding:4px 7px;min-width:85px;background:#f5f5f5;border-right:1px solid #ccc;font-weight:600;color:#555;flex-shrink:0}
.cs-tbl .val{font-size:12px;padding:4px 7px;flex:1;word-break:break-word}

.cs-attr-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ccc}
.cs-ac{padding:6px 8px;border-right:1px solid #ccc;border-bottom:1px solid #ccc;display:flex;justify-content:space-between;align-items:center;gap:4px}
.cs-ac:nth-child(2n){border-right:none}
.cs-ac:nth-last-child(-n+2){border-bottom:none}
.cs-ac .n{font-size:11px;font-weight:600;color:#333;line-height:1.2}
.cs-ac .a{font-size:9px;color:#999}
.cs-ac .v{font-size:18px;font-weight:900;color:#111;min-width:26px;text-align:right}
.cs-ac .v.derived{color:#1565c0}

.cs-talent-grid{border:1px solid #ccc}
.cs-tr{display:flex;border-bottom:1px solid #ccc;align-items:stretch}
.cs-tr:last-child{border-bottom:none}
.cs-tn{flex:1;font-size:11px;padding:3px 7px;display:flex;align-items:center;line-height:1.3}
.cs-ta{font-size:9px;color:#999;padding:3px 5px;min-width:78px;display:flex;align-items:center;border-left:1px solid #eee}
.cs-tv{font-size:14px;font-weight:700;padding:3px 7px;min-width:38px;text-align:right;border-left:1px solid #ccc;display:flex;align-items:center;justify-content:flex-end;color:#ccc}
.cs-tv.set{color:#1565c0}

.cs-waffen-tbl{width:100%;border-collapse:collapse;font-size:11px}
.cs-waffen-tbl th{background:#e8e8e8;padding:4px 6px;border:1px solid #ccc;font-weight:700;text-align:left}
.cs-waffen-tbl td{padding:4px 6px;border:1px solid #ccc;min-height:18px}

.cs-spez{border:1px solid #ccc;padding:7px;font-size:11px;min-height:32px}
.cs-spez .sp{margin-bottom:3px;line-height:1.4}
.cs-spez .pos-lbl{color:#1565c0;font-weight:700}
.cs-spez .neg-lbl{color:#c62828;font-weight:700}
.cs-spez .sp-src{color:#999;font-size:9px}

/* ── EDITOR PANEL ── */
.editor-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

.tabs{display:flex;background:#090d17;padding:6px 8px 0;gap:3px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:5px 12px;border:none;background:var(--bg3);color:var(--muted);cursor:pointer;border-radius:5px 5px 0 0;font-size:12px;font-weight:700;transition:all .15s;white-space:nowrap;position:relative;border:1px solid transparent;border-bottom:none}
.tab-btn:hover:not(.active){background:var(--bg4);color:var(--text)}
.tab-btn.active{background:var(--bg);color:var(--text);border-color:var(--border)}
.tab-btn .tab-badge{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%}
.tab-btn .tab-badge.ok{background:var(--ok)}
.tab-btn .tab-badge.over{background:var(--err)}
.tab-btn .tab-badge.partial{background:var(--warn)}

.tab-content{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── FORM ── */
.fg{margin-bottom:11px}
.fg label,.fg-lbl{display:block;font-size:11px;color:var(--accent2);margin-bottom:3px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.fg input[type=text],.fg input[type=number],.fg select,.fg textarea{width:100%;padding:7px 9px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:13px;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent2)}
.fg select option{background:var(--bg2)}
.fg textarea{resize:vertical;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.radio-row{display:flex;gap:14px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);cursor:pointer;font-weight:400;text-transform:none;letter-spacing:0}
.radio-row input[type=radio]{width:auto;accent-color:var(--accent)}

.sec{font-size:13px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--bg4);padding-bottom:5px;margin:16px 0 10px}

/* ── ATTRIBUTE CARDS ── */
.attr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.attr-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 10px 8px;transition:border-color .2s}
.attr-card:hover{border-color:var(--accent2)}
.attr-card .al{font-size:11px;color:var(--accent2);font-weight:700;letter-spacing:.4px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.attr-card .al .abbr{font-size:11px;color:var(--muted);background:var(--bg3);padding:1px 6px;border-radius:3px}
.attr-spinrow{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:5px}
.spin{width:28px;height:28px;border:none;border-radius:50%;background:var(--bg3);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;line-height:1}
.spin:hover:not(:disabled){background:var(--accent)}
.spin:disabled{opacity:.3;cursor:not-allowed}
.attr-num{font-size:26px;font-weight:900;color:#fff;min-width:40px;text-align:center;line-height:1}
.attr-cost-row{font-size:10px;color:var(--muted);text-align:center;display:flex;justify-content:space-between}
.attr-cost-row .tier-1{color:var(--accent2)}
.attr-cost-row .tier-2{color:var(--warn)}
.attr-cost-row .tier-3{color:var(--err)}

/* ── DERIVED DISPLAY ── */
.derived-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.derived-card{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px;text-align:center}
.derived-card .dl{font-size:11px;color:var(--muted);margin-bottom:4px}
.derived-card .dv{font-size:28px;font-weight:900;color:var(--accent2)}
.derived-card .df{font-size:10px;color:var(--muted);margin-top:2px}

/* ── ATTR BUDGET BAR ── */
.budget-bar-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:12px}
.budget-bar-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.budget-bar-header .bl{color:var(--muted)}
.budget-bar-header .bv{font-weight:700}
.budget-bar-outer{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.budget-bar-inner{height:100%;border-radius:4px;background:var(--accent2);transition:width .2s}
.budget-bar-inner.full{background:var(--ok)}
.budget-bar-inner.over{background:var(--err)}

/* ── TALENT ROWS ── */
.talent-header{background:var(--bg2);border:1px solid var(--accent);border-radius:7px;padding:9px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.talent-header .th-info{display:flex;gap:12px;font-size:12px}
.talent-header .th-avail{color:var(--muted)}
.talent-header .th-val{font-weight:700}
.talent-header .th-val.ok{color:var(--ok)}
.talent-header .th-val.over{color:var(--err)}
.talent-header .th-val.neutral{color:var(--accent2)}
.th-prog-wrap{flex:1;min-width:120px}
.th-prog-outer{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.th-prog-inner{height:100%;border-radius:3px;background:var(--accent2);transition:width .2s}
.th-prog-inner.ok{background:var(--ok)}
.th-prog-inner.over{background:var(--err)}

.talent-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-bottom:4px;transition:border-color .15s}
.talent-row:hover{border-color:var(--accent2)}
.talent-row.highlighted{border-color:var(--warn);background:color-mix(in srgb,var(--bg2) 85%,var(--warn) 15%)}
.tr-name{flex:1;font-size:13px;line-height:1.3;min-width:0}
.tr-attrs{font-size:10px;color:var(--muted);min-width:76px;flex-shrink:0}
.tr-badges{display:flex;gap:3px;align-items:center;flex-shrink:0}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;white-space:nowrap}
.badge-beruf{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);border:1px solid var(--warn)}
.badge-h1{background:color-mix(in srgb,var(--accent2) 20%,transparent);color:var(--accent2);border:1px solid var(--accent2)}
.badge-h2{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok);border:1px solid var(--ok)}
.tr-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.t-btn{width:24px;height:24px;border:none;border-radius:50%;background:var(--bg3);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1}
.t-btn:hover:not(:disabled){background:var(--accent)}
.t-btn:disabled{opacity:.25;cursor:not-allowed}
.t-val{font-size:18px;font-weight:900;color:var(--accent2);min-width:32px;text-align:center}
.t-cost{font-size:9px;color:var(--warn);min-width:26px;text-align:center;flex-shrink:0}

/* ── SPEZIFIKA ── */
.spez-card{background:var(--bg2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:7px}
.spez-card.pos{border-color:var(--ok)}
.spez-card.neg{border-color:var(--err)}
.spez-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;color:var(--muted)}
.spez-card.pos .spez-lbl{color:var(--ok)}
.spez-card.neg .spez-lbl{color:var(--err)}
.spez-card input{width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:13px}
.spez-card input:focus{outline:none;border-color:var(--accent2)}

/* ── WAFFEN ── */
.waffen-grid{display:grid;grid-template-columns:2.5fr 1fr 1fr 1fr 1.5fr 30px;gap:5px;align-items:center;margin-bottom:5px}
.waffen-grid.header{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;padding:0 0 2px}
.waffen-grid input{padding:6px 7px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;width:100%}
.waffen-grid input:focus{outline:none;border-color:var(--accent2)}
.wdel{background:#8b1a1a;border:none;color:#fff;border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wdel:hover{background:var(--err)}
.waffen-add{background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok);color:var(--ok);border-radius:5px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:700;margin-top:6px;transition:background .15s}
.waffen-add:hover{background:color-mix(in srgb,var(--ok) 25%,transparent)}

/* ── INFO BOX ── */
.info-box{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.info-box strong{color:var(--text)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:none;transition:opacity .3s}

/* ── PRINT ── */
@media print {
  .editor-panel,.tabs,.statusbar,.checklist,.topbar{display:none!important}
  .main{display:block}
  .sheet-panel{width:100%;border:none;padding:10px;overflow:visible}
  body{height:auto;overflow:auto}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">T.E.A.R.S.</div>
  <div class="topbar-sep"></div>
  <span style="font-size:12px;color:var(--muted)">Charaktererstellung</span>
  <span class="save-indicator" id="save-indicator">● Ungespeichert</span>
  <div class="topbar-actions">
    <button class="btn-save" onclick="saveChar()">💾 Speichern</button>
    <button class="btn-load" onclick="loadChar()">📂 Laden</button>
    <button class="btn-exp" onclick="exportChar()">⬇ Export</button>
    <button class="btn-imp" onclick="document.getElementById('imp-file').click()">⬆ Import</button>
    <button class="btn-print" onclick="window.print()">🖨 Drucken</button>
    <button class="btn-reset" onclick="resetChar()">↺ Neu</button>
    <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importChar(this)">
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar" id="statusbar"></div>

<!-- CHECKLIST -->
<div class="checklist" id="checklist"></div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT: SHEET PREVIEW -->
  <div class="sheet-panel" id="sheet"></div>

  <!-- RIGHT: EDITOR -->
  <div class="editor-panel">
    <div class="tabs" id="tabs"></div>
    <div class="tab-content" id="tab-content">
      <div id="tab-charakter"  class="tab-pane active"></div>
      <div id="tab-attribute"  class="tab-pane"></div>
      <div id="tab-wissen"     class="tab-pane"></div>
      <div id="tab-soziales"   class="tab-pane"></div>
      <div id="tab-sportliches"class="tab-pane"></div>
      <div id="tab-aktionen"   class="tab-pane"></div>
      <div id="tab-handwerk"   class="tab-pane"></div>
      <div id="tab-kampf"      class="tab-pane"></div>
      <div id="tab-waffen"     class="tab-pane"></div>
      <div id="tab-notizen"    class="tab-pane"></div>
    </div>
  </div>
</div>

<script>
'use strict';
// ══════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════
const TALENT_CATS = {
  wissen:      { label:'Wissen',      talents:[
    {n:'Chemie',a:'IN/IN/MB'},{n:'Physik',a:'IN/IN/MB'},{n:'Biologie',a:'IN/IN/MB'},
    {n:'Medizin',a:'IN/IN/MB'},{n:'Mathematik',a:'IN/IN/MB'},{n:'Meteorologie',a:'IN/MB/IN'},
    {n:'Botanik',a:'IN/IN/MB'},{n:'Literatur',a:'IN/IN/IN'},{n:'Überlebenstechniken',a:'IN/MB/MB'},
    {n:'Urbanes Wissen',a:'IN/MB/MB'},{n:'Ländliches Wissen',a:'IN/MB/MB'},
  ]},
  soziales:    { label:'Soziales',    talents:[

    {n:'Überreden',a:'IN/CH/CH'},{n:'Betöhren',a:'GE/IN/MB'},{n:'Feilschen',a:'CH/CH/CH'},
    {n:'Lügen',a:'CH/IN/IN'},{n:'Menschenkenntnis',a:'IN/IN/MB'},{n:'Begeistern / Führen',a:'CH/CH/MB'},
  ]},
  sportliches: { label:'Sportliches', talents:[
    {n:'Laufen',a:'AU/KK/AU'},{n:'Klettern',a:'KK/AU/KK'},{n:'Schwimmen',a:'KK/AU/AU'},
    {n:'Springen',a:'KK/GE/AU'},{n:'Werfen',a:'KK/KK/GE'},{n:'Balancieren',a:'GE/GE/AU'},
  ]},
  aktionen:    { label:'Aktionen',    talents:[
    {n:'Erste Hilfe',a:'IN/GE/GE'},{n:'Fahren',a:'GE/GE/MB'},{n:'Reiten',a:'GE/GE/AU'},
    {n:'Spurenlesen',a:'IN/MB/MB'},{n:'Fliegen',a:'MB/GE/GE'},{n:'Tiere Zähmen',a:'CH/IN/MB'},
    {n:'Schlösser Knacken',a:'GE/GE/IN'},{n:'Schleichen',a:'GE/GE/AU'},
  ]},
  handwerk:    { label:'Handwerk',    talents:[
    {n:'Bogenbau',a:'GE/GE/IN'},{n:'Schmieden',a:'GE/KK/GE'},{n:'Tischlern',a:'GE/GE/KK'},
    {n:'Maurern',a:'KK/KK/GE'},{n:'Zeichnen',a:'GE/GE/MB'},{n:'Mechanik',a:'GE/IN/IN'},
    {n:'Technik',a:'MB/IN/IN'},
  ]},
  kampf:       { label:'Kampf',       talents:[
    {n:'Nahkampfwaffe Spitz',a:''},{n:'Nahkampfwaffe Scharf',a:''},{n:'Nahkampfwaffe Stumpf',a:''},
    {n:'Wurfwaffen',a:''},{n:'Faustfeuerwaffen',a:''},{n:'Langwaffen',a:''},
    {n:'Spezialwaffen',a:''},{n:'Bogenschießen',a:''},{n:'Faustkampf / Kampfkünste',a:''},
  ]},
};
const TALENT_CAT_KEYS = Object.keys(TALENT_CATS);
const ATTR_KEYS = ['KK','AU','GE','IN','CH','MB'];
const ATTR_NAMES = {KK:'Körperkraft',AU:'Ausdauer',GE:'Geschicklichkeit',IN:'Intelligenz',CH:'Charme',MB:'Ment. Belastbarkeit'};
const ATTR_BASE = 8, ATTR_MAX = 19, ATTR_POOL = 14;

// ── name → category lookup ──
const TALENT_CAT_OF = {};
for (const [cat, data] of Object.entries(TALENT_CATS))
  for (const t of data.talents) TALENT_CAT_OF[t.n] = cat;

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
function freshState() {
  const talente = {};
  for (const [cat, d] of Object.entries(TALENT_CATS)) {
    talente[cat] = {};
    for (const t of d.talents) talente[cat][t.n] = 0;
  }
  return {
    g: { name:'', geschlecht:'männlich', beruf:'', alter:'', groesse:'',
         hobby1:'', hobby2:'',
         berufTalent:'', berufBonusCat:'wissen', berufBonusPts:0,
         hobby1Talent:'', hobby2Talent:'',
         spezPos:'', spezNegBeruf:'', spezNegHobby1:'', spezNegFrei:'' },
    attr: { KK:8, AU:8, GE:8, IN:8, CH:8, MB:8 },
    kw:   { ATN:0, PA:0, ATD:0, INI:0 },
    talente,
    waffen: [],
    notizen: ''
  };
}
let S = freshState();
let currentTab = 'charakter';
let dirty = false;

// ══════════════════════════════════════════════════
// RULES
// ══════════════════════════════════════════════════
function stepCost(from) {
  const to = from + 1;
  if (to <= 14) return 1;
  if (to <= 17) return 2;
  return 3;
}
function attrCost(val) {
  let c = 0;
  for (let v = ATTR_BASE; v < val; v++) c += stepCost(v);
  return c;
}
function poolSpent() {
  return ATTR_KEYS.reduce((s, k) => s + attrCost(S.attr[k]), 0);
}
function poolLeft() { return ATTR_POOL - poolSpent(); }

function calcLE() { return (S.attr.KK + S.attr.AU) * 3; }
function calcGG() { return (S.attr.AU + S.attr.IN + S.attr.MB) * 3; }

function talentAvail(cat) {
  let p = 10;
  const g = S.g;
  if (g.berufBonusCat === cat) p += Number(g.berufBonusPts || 0);
  if (g.berufTalent  && TALENT_CAT_OF[g.berufTalent]  === cat) p += 5;
  if (g.hobby1Talent && TALENT_CAT_OF[g.hobby1Talent] === cat) p += 5;
  if (g.hobby2Talent && TALENT_CAT_OF[g.hobby2Talent] === cat) p += 3;
  return p;
}
function talentSpent(cat) {
  const mul = cat === 'kampf' ? 2 : 1;
  return Object.values(S.talente[cat]).reduce((s, v) => s + v * mul, 0);
}
function talentLeft(cat) { return talentAvail(cat) - talentSpent(cat); }

function talentBadgeClass(cat) {
  const l = talentLeft(cat), a = talentAvail(cat), sp = talentSpent(cat);
  if (sp === 0) return '';
  if (l < 0) return 'over';
  if (l === 0) return 'ok';
  return 'partial';
}

// ══════════════════════════════════════════════════
// TAB MANAGEMENT
// ══════════════════════════════════════════════════
const TABS = [
  {id:'charakter',   label:'Charakter'},
  {id:'attribute',   label:'Attribute'},
  {id:'wissen',      label:'Wissen',      cat:'wissen'},
  {id:'soziales',    label:'Soziales',    cat:'soziales'},
  {id:'sportliches', label:'Sportliches', cat:'sportliches'},
  {id:'aktionen',    label:'Aktionen',    cat:'aktionen'},
  {id:'handwerk',    label:'Handwerk',    cat:'handwerk'},
  {id:'kampf',       label:'Kampf',       cat:'kampf'},
  {id:'waffen',      label:'Waffen'},
  {id:'notizen',     label:'Notizen'},
];

function buildTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const badge = t.cat ? `<span class="tab-badge ${talentBadgeClass(t.cat)}"></span>` : '';
    return `<button class="tab-btn${t.id === currentTab ? ' active' : ''}" data-tab="${t.id}">${t.label}${badge}</button>`;
  }).join('');
}

function refreshTabBadges() {
  document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
    const t = TABS.find(x => x.id === btn.dataset.tab);
    if (!t || !t.cat) return;
    let badge = btn.querySelector('.tab-badge');
    if (!badge) { badge = document.createElement('span'); badge.className='tab-badge'; btn.appendChild(badge); }
    badge.className = 'tab-badge ' + talentBadgeClass(t.cat);
  });
}

function showTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  renderActiveTab();
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn && btn.dataset.tab) showTab(btn.dataset.tab);
});

// ══════════════════════════════════════════════════
// RENDER STRATEGY
// - lightRender: only statusbar + checklist + sheet (no tab rebuild → no focus loss)
// - fullRender:  + also rebuilds the active tab
// - renderActiveTab: just rebuilds the current tab
// ══════════════════════════════════════════════════
function lightRender() {
  markDirty();
  renderStatusBar();
  renderChecklist();
  renderSheet();
}

function fullRender() {
  markDirty();
  renderStatusBar();
  renderChecklist();
  renderSheet();
  renderActiveTab();
  refreshTabBadges();
}

function renderActiveTab() {
  switch (currentTab) {
    case 'charakter':    renderTabCharakter();  break;
    case 'attribute':    renderTabAttribute();  break;
    case 'notizen':      renderTabNotizen();    break;
    case 'waffen':       renderTabWaffen();     break;
    default:             renderTabTalent(currentTab); break;
  }
}

// ══════════════════════════════════════════════════
// STATUS BAR
// ══════════════════════════════════════════════════
function renderStatusBar() {
  const spent = poolSpent();
  const left  = poolLeft();
  const pct   = Math.min(100, (spent / ATTR_POOL) * 100);
  const cls   = left < 0 ? 'over' : left === 0 ? 'full' : '';
  let html = `<div class="status-chip ${cls}" title="Attributpunkte: ${spent} von ${ATTR_POOL} vergeben">
    <span class="s-lbl">Attribut</span>
    <div class="s-prog">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="s-val">${left < 0 ? '−' : ''}${Math.abs(left)}</span>
    </div>
  </div>`;
  for (const cat of TALENT_CAT_KEYS) {
    const a = talentAvail(cat), sp = talentSpent(cat), l = a - sp;
    const p = Math.min(100, (sp / Math.max(a, 1)) * 100);
    const cc = l < 0 ? 'over' : l === 0 ? 'full' : '';
    html += `<div class="status-chip ${cc}" title="${TALENT_CATS[cat].label}: ${sp} von ${a} Punkten vergeben">
      <span class="s-lbl">${TALENT_CATS[cat].label.slice(0,5)}.</span>
      <div class="s-prog">
        <div class="prog-bar"><div class="prog-fill" style="width:${p}%"></div></div>
        <span class="s-val">${l < 0 ? '−' : ''}${Math.abs(l)}</span>
      </div>
    </div>`;
  }
  document.getElementById('statusbar').innerHTML = html;
}

// TAB: ATTRIBUTE
// ══════════════════════════════════════════════════
function renderTabAttribute() {
  const a = S.attr; const left = poolLeft(); const spent = poolSpent();
  const pct = Math.min(100, (spent / ATTR_POOL) * 100);
  const barCls = left < 0 ? 'over' : left === 0 ? 'full' : '';

  let h = `<div class="info-box">
    Jedes Attribut startet bei <strong>8</strong>. Du hast <strong>${ATTR_POOL} Punkte</strong> zu verteilen.<br>
    Werte 15–17 kosten je <span style="color:var(--warn)">2 Punkte</span> &nbsp;·&nbsp;

    Max: <strong>19</strong>
  </div>
  <div class="budget-bar-wrap">
    <div class="budget-bar-header">
      <span class="bl">Punktebudget</span>
      <span class="bv" style="color:${left<0?'var(--err)':left===0?'var(--ok)':'var(--accent2)'}">${spent} / ${ATTR_POOL} vergeben — ${left<0?'<strong style=color:var(--err)>ÜBERZOGEN!</strong>':'<strong>'+Math.abs(left)+'</strong> verbleibend'}</span>
    </div>
    <div class="budget-bar-outer">
      <div class="budget-bar-inner ${barCls}" style="width:${pct}%"></div>
    </div>
  </div>
  <div class="attr-grid">`;

  for (const k of ATTR_KEYS) {
    const v = a[k];
    const cost = attrCost(v);
    const next = v < ATTR_MAX ? stepCost(v) : null;
    const canUp = v < ATTR_MAX && left >= stepCost(v);
    const canDown = v > ATTR_BASE;
    const tier = v <= 14 ? 'tier-1' : v <= 17 ? 'tier-2' : 'tier-3';
    h += `<div class="attr-card" data-attr="${k}">
      <div class="al">
        <span>${ATTR_NAMES[k]}</span>
        <span class="abbr">${k}</span>
      </div>
      <div class="attr-spinrow">
        <button class="spin spin-down" data-attr="${k}" ${canDown?'':'disabled'}>−</button>
        <div class="attr-num ${tier}">${v}</div>
        <button class="spin spin-up" data-attr="${k}" ${canUp?'':'disabled'}>+</button>
      </div>
      <div class="attr-cost-row">
        <span>Investiert: ${cost}P</span>
        <span>${next ? `Nächster: <span class="${tier}">${next}P</span>` : '<span style="color:var(--muted)">Maximum</span>'}</span>
      </div>
    </div>`;
  }
  h += `</div>`;

  h += `<div class="sec">Abgeleitete Werte</div>
  <div class="derived-grid">
    <div class="derived-card">
      <div class="dl">Lebensenergie (LE)</div>
      <div class="dv">${calcLE()}</div>
      <div class="df">= (KK + AU) × 3</div>
    </div>
    <div class="derived-card">
      <div class="dl">Geistige Gesundheit (GG)</div>
      <div class="dv">${calcGG()}</div>
      <div class="df">= (AU + IN + MB) × 3</div>
    </div>
  </div>

  <div class="sec">Kampfwerte <span style="font-size:11px;color:var(--muted);font-weight:400">(manuell)</span></div>
  <div class="grid2">
    ${['ATN','PA','ATD','INI'].map(k => {
      const labels = {ATN:'Attacke Nahkampf',PA:'Parade',ATD:'Attacke Distanz',INI:'Initiative'};
      return `<div class="fg"><label>${labels[k]} (${k})</label>
        <input type="number" class="kw-input" data-kw="${k}" min="0" max="99" value="${S.kw[k]}"></div>`;
    }).join('')}
  </div>`;

  document.getElementById('tab-attribute').innerHTML = h;

  // Wire kampfwerte inputs
  document.querySelectorAll('.kw-input').forEach(inp =>
    inp.addEventListener('input', () => { S.kw[inp.dataset.kw] = Number(inp.value)||0; lightRender(); })
  );
}

// Spin button event delegation (on attribute tab)
document.getElementById('tab-content').addEventListener('click', e => {
  // Attribute spin
  const spinBtn = e.target.closest('.spin');
  if (spinBtn && !spinBtn.disabled) {
    const attr = spinBtn.dataset.attr;
    const delta = spinBtn.classList.contains('spin-up') ? 1 : -1;
    if (attr) { changeAttr(attr, delta); return; }
  }
  // Talent buttons
  const tBtn = e.target.closest('.t-btn');
  if (tBtn && !tBtn.disabled) {
    const cat  = tBtn.dataset.cat;
    const name = tBtn.dataset.name;
    const delta = tBtn.dataset.dir === 'up' ? 1 : -1;
    if (cat && name) { changeTalent(cat, name, delta); return; }
  }
  // Waffe delete
  const delBtn = e.target.closest('.wdel');
  if (delBtn) {
    const idx = Number(delBtn.dataset.idx);
    S.waffen.splice(idx, 1);
    renderTabWaffen();
    lightRender();
  }
  // Waffe add
  if (e.target.classList.contains('waffen-add')) {
    S.waffen.push({name:'',art:'',attacke:'',parade:'',schaden:''});
    renderTabWaffen();
    lightRender();
  }
});

// ══════════════════════════════════════════════════
// TAB: TALENT CATEGORIES
// ══════════════════════════════════════════════════
function renderTabTalent(cat) {
  const data = TALENT_CATS[cat];
  const avail = talentAvail(cat), spent = talentSpent(cat), left = avail - spent;
  const pct = Math.min(100, (spent / Math.max(avail,1)) * 100);
  const lCls = left < 0 ? 'over' : left === 0 ? 'ok' : 'neutral';
  const pCls = left < 0 ? 'over' : left === 0 ? 'ok' : '';
  const isKampf = cat === 'kampf';

  let h = `<div class="talent-header">
    <div class="th-info">
      <span class="th-avail">Verfügbar: <strong>${avail}</strong></span>
      <span class="th-avail">Ausgegeben: <strong>${spent}</strong></span>
      <span class="th-avail">Verbleibend: <strong class="th-val ${lCls}">${left}</strong></span>
    </div>
    <div class="th-prog-wrap">
      <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${data.label} — Talentpunkte</div>
      <div class="th-prog-outer"><div class="th-prog-inner ${pCls}" style="width:${pct}%"></div></div>
    </div>
  </div>`;

  if (isKampf) {
    h += `<div class="info-box">⚠ Kampftalente haben keine Attributangaben → jeder Punkt kostet <strong style="color:var(--warn)">2 Talentpunkte</strong> aus dem Pool.</div>`;
  }

  const g = S.g;
  for (const t of data.talents) {
    const v = S.talente[cat][t.n];
    const isBeruf = g.berufTalent  === t.n;
    const isH1    = g.hobby1Talent === t.n;
    const isH2    = g.hobby2Talent === t.n;
    const costPP  = isKampf ? 2 : 1;
    const canUp   = left >= costPP;
    const canDown = v > 0;
    const highlighted = isBeruf || isH1 || isH2;

    let badges = '';
    if (isBeruf) badges += '<span class="badge badge-beruf">★ Beruf +5</span>';
    if (isH1)    badges += '<span class="badge badge-h1">● Hobby1 +5</span>';
    if (isH2)    badges += '<span class="badge badge-h2">● Hobby2 +3</span>';

    const safeN = esc(t.n);
    h += `<div class="talent-row${highlighted ? ' highlighted' : ''}">
      <div class="tr-name">${t.n}</div>
      ${t.a ? `<div class="tr-attrs">(${t.a})</div>` : '<div class="tr-attrs"></div>'}
      <div class="tr-badges">${badges}</div>
      <div class="tr-ctrl">
        <button class="t-btn" data-cat="${cat}" data-name="${safeN}" data-dir="down" ${canDown?'':'disabled'}>−</button>
        <div class="t-val">${v}</div>
        <button class="t-btn" data-cat="${cat}" data-name="${safeN}" data-dir="up"   ${canUp?'':'disabled'}>+</button>
      </div>
      ${isKampf ? `<div class="t-cost">${v>0?v*2+'P':''}</div>` : ''}
    </div>`;
  }

  document.getElementById('tab-' + cat).innerHTML = h;
}

// ══════════════════════════════════════════════════
// TAB: WAFFEN
// ══════════════════════════════════════════════════
function renderTabWaffen() {
  let h = `<div class="sec">Waffen</div>
    <div class="waffen-grid header">
      <span>Waffe</span><span>Art</span><span>Attacke</span><span>Parade</span><span>Schaden</span><span></span>
    </div>`;
  S.waffen.forEach((w, i) => {
    h += `<div class="waffen-grid">
      <input type="text" data-wi="${i}" data-wf="name"    value="${esc(w.name)}"    placeholder="Name">
      <input type="text" data-wi="${i}" data-wf="art"     value="${esc(w.art)}"     placeholder="Art">
      <input type="text" data-wi="${i}" data-wf="attacke" value="${esc(w.attacke)}" placeholder="ATK">
      <input type="text" data-wi="${i}" data-wf="parade"  value="${esc(w.parade)}"  placeholder="PA">
      <input type="text" data-wi="${i}" data-wf="schaden" value="${esc(w.schaden)}" placeholder="1W6+2">
      <button class="wdel" data-idx="${i}" title="Entfernen">✕</button>
    </div>`;
  });
  h += `<button class="waffen-add">+ Waffe hinzufügen</button>`;
  const el = document.getElementById('tab-waffen');
  el.innerHTML = h;

  // Wire inputs without tab rebuild (no focus loss)
  el.querySelectorAll('input[data-wi]').forEach(inp =>
    inp.addEventListener('input', () => {
      const i = Number(inp.dataset.wi);
      S.waffen[i][inp.dataset.wf] = inp.value;
      lightRender(); // only updates sheet + statusbar
    })
  );
}

// ══════════════════════════════════════════════════
// TAB: NOTIZEN
// ══════════════════════════════════════════════════
function renderTabNotizen() {
  const el = document.getElementById('tab-notizen');
  el.innerHTML = `<div class="sec">Notizen</div>
    <div class="fg"><textarea id="f-notizen" rows="24" style="min-height:450px;font-family:inherit">${esc(S.notizen)}</textarea></div>`;
  bindInput('f-notizen', v => { S.notizen = v; lightRender(); });
}

// ══════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════
function changeAttr(attr, delta) {
  const cur = S.attr[attr], nxt = cur + delta;
  if (nxt < ATTR_BASE || nxt > ATTR_MAX) return;
  if (delta > 0 && poolLeft() < stepCost(cur)) return;
  S.attr[attr] = nxt;
  fullRender();
}

function changeTalent(cat, name, delta) {
  const cur = S.talente[cat][name];
  const cost = cat === 'kampf' ? 2 : 1;
  if (delta > 0 && talentLeft(cat) < cost) return;
  if (delta < 0 && cur <= 0) return;
  S.talente[cat][name] = cur + delta;
  fullRender();
}

// ══════════════════════════════════════════════════
// PERSISTENCE
// ══════════════════════════════════════════════════
function markDirty() {
  dirty = true;
  const el = document.getElementById('save-indicator');
  el.textContent = '● Ungespeichert';
  el.classList.remove('saved');
}
function markSaved() {
  dirty = false;
  const el = document.getElementById('save-indicator');
  el.textContent = '✓ Gespeichert';
  el.classList.add('saved');
}

function saveChar() {
  try {
    localStorage.setItem('tears_v2', JSON.stringify(S));
    markSaved();
    toast('Charakter gespeichert!', 'var(--ok)');
  } catch(e) { toast('Fehler: ' + e.message, 'var(--err)'); }
}

function loadChar() {
  try {
    const raw = localStorage.getItem('tears_v2');
    if (!raw) { toast('Kein gespeicherter Charakter.', 'var(--warn)'); return; }
    S = mergeState(freshState(), JSON.parse(raw));
    renderAll();
    markSaved();
    toast('Charakter geladen!', 'var(--ok)');
  } catch(e) { toast('Fehler: ' + e.message, 'var(--err)'); }
}

function resetChar() {
  if (!confirm('Wirklich zurücksetzen? Alle Eingaben gehen verloren.')) return;
  S = freshState();
  renderAll();
  markDirty();
  toast('Charakter zurückgesetzt.', 'var(--warn)');
}

function exportChar() {
  const name = (S.g.name.trim() || 'charakter').replace(/\s+/g, '_').toLowerCase();
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: `tears_${name}.json`});
  a.click(); URL.revokeObjectURL(a.href);
  toast('Exportiert!', 'var(--ok)');
}

function importChar(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      S = mergeState(freshState(), parsed);
      renderAll();
      markSaved();
      toast('Importiert: ' + (S.g.name || 'Unbekannt'), 'var(--ok)');
    } catch(err) { toast('Import-Fehler: ' + err.message, 'var(--err)'); }
    input.value = '';
  };
  r.readAsText(f);
}

function mergeState(base, src) {
  const out = Object.assign({}, base);
  for (const k of Object.keys(src)) {
    if (src[k] !== null && typeof src[k] === 'object' && !Array.isArray(src[k])) {
      out[k] = mergeState(base[k] || {}, src[k]);
    } else {
      out[k] = src[k];
    }
  }
  return out;
}

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bindInput(id, fn) {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', () => fn(el.value));
}

function makeTalentSelect(id, selectedVal, onchangeExpr) {
  let h = `<select id="${id}" onchange="${onchangeExpr}">`;
  h += `<option value=""${selectedVal===''?' selected':''}>– kein –</option>`;
  for (const [cat, data] of Object.entries(TALENT_CATS)) {
    h += `<optgroup label="${esc(data.label)}">`;
    for (const t of data.talents) {
      h += `<option value="${esc(t.n)}"${selectedVal===t.n?' selected':''}>${esc(t.n)}</option>`;
    }
    h += `</optgroup>`;
  }
  return h + `</select>`;
}

function toast(msg, color) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = color;
  t.style.color = ['var(--ok)','var(--warn)','#56c27a','#ffb300'].includes(color) ? '#0b0f1a' : '#fff';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
}

// ══════════════════════════════════════════════════
// FULL RENDER (only on init / load / reset)
// ══════════════════════════════════════════════════
function renderAll() {
  buildTabs();
  renderStatusBar();
  renderChecklist();
  renderSheet();
  renderActiveTab();
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
// Try to auto-load last save
try {
  const raw = localStorage.getItem('tears_v2');
  if (raw) { S = mergeState(freshState(), JSON.parse(raw)); markSaved(); }
} catch(e) {}

renderAll();

// Auto-save every 60s if dirty
setInterval(() => { if (dirty) saveChar(); }, 60000);

// Keyboard shortcut: Ctrl+S
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveChar(); }
});
</script>
